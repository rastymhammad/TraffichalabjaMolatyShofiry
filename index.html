<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیسته‌می سه‌ره‌گرتنی مۆڵه‌تی شۆفێری هاتووچۆی هه‌ڵه‌بجه‌</title>
    <style>
        @font-face {
            font-family: 'Rabar';
            src: url('https://kurdish-fonts.com/fonts/rabar/Rabar_013.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'Rabar', Tahoma, Arial, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            padding: 20px;
            text-align: center;
            transition: background-color 0.4s, color 0.4s;
        }
        .header-title {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            margin: auto auto 20px auto;
            border-bottom: 4px solid #0056b3;
        }
        .header-title h1 {
            color: #0056b3;
            font-size: 20px;
            margin: 0;
            font-weight: bold;
        }
        .header-title p {
            color: #555;
            font-size: 14px;
            margin: 8px 0 0 0;
        }
        .status-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
        }
        .status-open { background: #d4edda; color: #155724; }
        .status-closed { background: #f8d7da; color: #721c24; }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto auto 25px auto;
        }
        #adminSection {
            max-width: 650px;
        }
        h2 {
            color: #0056b3;
            margin-bottom: 20px;
            font-size: 18px;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: 'Rabar', Tahoma, Arial, sans-serif; 
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            width: 95%;
            margin-top: 10px;
            font-family: 'Rabar', Tahoma, Arial, sans-serif;
        }
        button:hover {
            background: #218838;
        }
        .search-btn {
            background: #007bff;
        }
        .search-btn:hover {
            background: #0056b3;
        }
        .message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
        }
        .timer-box {
            font-size: 14px;
            color: #d9534f;
            margin-top: 10px;
            font-weight: bold;
        }
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            width: auto;
            padding: 0;
            margin: 0;
        }
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        body.dark-mode .header-title,
        body.dark-mode .container {
            background-color: #1e1e1e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-bottom-color: #4da3ff;
        }
        body.dark-mode .header-title h1,
        body.dark-mode h2 {
            color: #4da3ff;
        }
        body.dark-mode .header-title p {
            color: #aaa;
        }
        body.dark-mode input {
            background-color: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="گۆڕینی ڕەنگ">🌙</button>

    <div class="header-title">
        <h1>بەڕێوەبەرایەتی هاتووچۆی پارێزگای هەڵەبجە</h1>
        <p>ئاماده‌كردنی ڕێپێدراوی هاتووچۆ ( ڕاستی محمد حیدر )</p>
        <div id="statusBadge" class="status-badge status-open">دۆخی سیستەم: کراوەیە بۆ تۆمارکردن ✓</div>
    </div>

    <div class="container">
        <h2>تۆمارکردنی ناو</h2>
        <input type="text" id="nameInput" placeholder="ناوی چواری بنووسە...">
        <input type="tel" id="phoneInput" placeholder="ژمارەی تەلەفۆن (07700000000)..." maxlength="15">
        <button onclick="registerUser()">تۆمارکردن</button>
        <div id="registerMessage" class="message"></div>
        <div id="countdownTimer" class="timer-box"></div>
    </div>

    <div class="container">
        <h2>دڵنیابوونەوە لە ناوت (بە ژمارەی تەلەفۆن)</h2>
        <input type="tel" id="searchInput" placeholder="ژمارەی تەلەفۆنەکەت بنووسە..." maxlength="15">
        <button class="search-btn" onclick="searchUser()">گەڕان</button>
        <div id="searchMessage" class="message"></div>
    </div>

    <div class="container printable-area" id="adminSection" style="display: none;">
        <h2>بەشی ئەدمن - کۆنتڕۆڵی سیستەم</h2>
        <button class="search-btn" onclick="loadTodayUsers()">نیشاندانی لیستی ئەمڕۆ</button>
        <button style="background: #17a2b8;" onclick="downloadExcel()">داونلۆدکردنی ئێکسڵ (Excel/CSV)</button>
        <button style="background: #ffc107; color: black;" onclick="toggleSystemStatus()">ڕاگرتن / کردنەوەی سایت</button>
        <button style="background: #6c757d;" onclick="window.print()">چاپکردنی لیست (Print)</button>
        <button style="background: #dc3545; margin-top: 5px;" onclick="hideAdminPanel()">داخستنی بەشی ئەدمن</button>
        
        <div id="adminMessage" class="message" style="color: red; margin-top: 10px;"></div>

        <table id="usersTable" border="1" style="width:100%; margin-top:15px; border-collapse: collapse; text-align: center;">
            <thead>
                <tr style="background: #0056b3; color: white;">
                    <th style="padding: 8px;">ژمارە</th>
                    <th style="padding: 8px;">ناو</th>
                    <th style="padding: 8px;">ژمارەی تەلەفۆن</th>
                    <th style="padding: 8px;">کاتی تۆمارکردن</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <button onclick="showAdminPanel()" style="background: none; color: #aaa; border: none; font-size: 12px; cursor: pointer; width: auto;">چوونەژوورەوەی ئەدمن</button>
    </div>

    <script>
        const apiUrl = "https://rastymhammad-001-site1.itempurl.com/api/users";
        let globalUsersData = [];

        // کاتی ژمێرەری پێچەوانە تا سەعات 6ی ئێوارە
        function updateCountdown() {
            let now = new Date();
            let target = new Date();
            target.setHours(18, 0, 0, 0); // سەعات 18:00 (6ی ئێوارە)
            
            if (now > target) {
                target.setDate(target.getDate() + 1); // ئەگەر تێپەڕیبوو، دەیخاتە سەعات 6ی سبەی
            }
            
            let diff = target - now;
            let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById("countdownTimer").innerText = `ماوە بۆ کردنەوەی پشکی سبەی: کاتژمێر ${hours} : خولەک ${minutes} : چرکە ${seconds}`;
        }
        setInterval(updateCountdown, 1000);

        const themeBtn = document.getElementById("themeToggleBtn");
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            themeBtn.innerText = "☀️";
        }

        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            if (document.body.classList.contains("dark-mode")) {
                themeBtn.innerText = "☀️";
                localStorage.setItem("theme", "dark");
            } else {
                themeBtn.innerText = "🌙";
                localStorage.setItem("theme", "light");
            }
        }

        async function registerUser() {
            let name = document.getElementById("nameInput").value.trim();
            let phone = document.getElementById("phoneInput").value.trim();
            let messageDiv = document.getElementById("registerMessage");

            if(name === "" || phone === "") {
                messageDiv.style.color = "#ff4d4d";
                messageDiv.innerText = "تکایە ناو و ژمارەی تەلەفۆن بە دروستی پڕبکەرەوە!";
                return;
            }

            let englishRegex = /[a-zA-Z]/;
            if (englishRegex.test(name)) {
                messageDiv.style.color = "#ff4d4d";
                messageDiv.innerText = "تکایە ناوی چواری بە پیتی کوردی بنووسه (پیتی ئینگلیزی قەدەغەیە)!";
                return;
            }

            let nameParts = name.split(/\s+/);
            if (nameParts.length < 4) {
                messageDiv.style.color = "#ff4d4d";
                messageDiv.innerText = "تکایە ناوی چواری بنووسە!";
                return;
            }

            if (phone.length < 11) {
                messageDiv.style.color = "#ff4d4d";
                messageDiv.innerText = "ژمارەی تەلەفۆن نابێت لە 11 ژمارە کەمتر بێت!";
                return;
            }

            try {
                let response = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: name, phone: phone })
                });

                let result = await response.json();

                if(response.ok) {
                    messageDiv.style.color = "#28a745";
                    messageDiv.innerText = result.message;
                    document.getElementById("nameInput").value = "";
                    document.getElementById("phoneInput").value = "";
                } else {
                    messageDiv.style.color = "orange";
                    messageDiv.innerText = result.message || "کێشەیەک ڕوویدا";
                }
            } catch (error) {
                console.error("Error:", error);
                messageDiv.style.color = "#ff4d4d";
                messageDiv.innerText = "کێشەیەک هەیە لە پەیوەندیکردن بە سێرڤەرەوە!";
            }
        }

        async function searchUser() {
            let searchPhone = document.getElementById("searchInput").value.trim();
            let messageDiv = document.getElementById("searchMessage");

            if(searchPhone === "") {
                messageDiv.style.color = "#ff4d4d";
                messageDiv.innerText = "تکایە ژمارەی تەلەفۆن بنووسە بۆ گەڕان!";
                return;
            }

            try {
                let response = await fetch(`${apiUrl}/search/${encodeURIComponent(searchPhone)}`);
                let result = await response.json();
                
                if(response.ok) {
                    messageDiv.style.color = "#28a745";
                    messageDiv.innerText = result.message;
                } else {
                    messageDiv.style.color = "#ff4d4d";
                    messageDiv.innerText = result.message || "ناو نەدۆزرایەوە!";
                }
            } catch (error) {
                console.error("Error:", error);
                messageDiv.style.color = "#ff4d4d";
                messageDiv.innerText = "کێشەیەک هەیە لە پەیوەندیکردن بە سێرڤەرەوە!";
            }
        }

        function showAdminPanel() {
            let password = prompt("تکایە پاسوۆردی ئەدمن بنووسە:");
            if (password === "0007") {
                document.getElementById("adminSection").style.display = "block";
            } else if (password !== null) {
                alert("پاسوۆرد هەڵەیە!");
            }
        }

        function hideAdminPanel() {
            document.getElementById("adminSection").style.display = "none";
            document.getElementById("tableBody").innerHTML = "";
            document.getElementById("adminMessage").innerText = "";
        }

        async function toggleSystemStatus() {
            let password = prompt("تکایە پاسوۆردی ئەدمن بنووسە بۆ گۆڕینی باری سایت:");
            if (password !== "0007") {
                if (password !== null) alert("پاسوۆرد هەڵەیە!");
                return;
            }

            try {
                let response = await fetch("https://rastymhammad-001-site1.itempurl.com/api/admin/toggle-status", {
                    method: "POST",
                    headers: { "Admin-Password": "0007" }
                });
                let result = await response.json();
                if(response.ok) {
                    alert(result.message);
                    location.reload();
                } else {
                    alert("هەڵە ڕووی دا!");
                }
            } catch (error) {
                alert("کێشەیەک هەیە لە پەیوەندیکردن بە سێرڤەرەوە!");
            }
        }

        async function loadTodayUsers() {
            let messageDiv = document.getElementById("adminMessage");
            let tbody = document.getElementById("tableBody");

            try {
                let response = await fetch(`${apiUrl}/today-list`, {
                    method: "GET",
                    headers: { "Admin-Password": "0007" }
                });

                if (!response.ok) {
                    let errResult = await response.json();
                    messageDiv.innerText = errResult.message || "هەڵەیەک ڕوویدا";
                    tbody.innerHTML = "";
                    return;
                }

                messageDiv.innerText = "";
                globalUsersData = await response.json();
                tbody.innerHTML = "";

                if(globalUsersData.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4' style='padding: 10px;'>هیچ ناوێک بۆ ئەمڕۆ تۆمار نەکراوە!</td></tr>";
                    return;
                }

                globalUsersData.forEach(user => {
                    let row = `<tr>
                        <td style="padding: 8px; font-weight: bold; color: #4da3ff;">${user.rank}</td>
                        <td style="padding: 8px;">${user.name}</td>
                        <td style="padding: 8px;">${user.phone}</td>
                        <td style="padding: 8px;">${user.createdAt}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error:", error);
                messageDiv.innerText = "کێشەیەک هەیە لە پەیوەندیکردن بە سێرڤەرەوە!";
            }
        }

        // داونلۆدکردنی لیستی ناوەکان بۆ فایلێکی اکسڵ (CSV)
        function downloadExcel() {
            if (globalUsersData.length === 0) {
                alert("سەرەتا تکایە لە سەرەوە 'نیشاندانی لیستی ئەمڕۆ' دابگرە!");
                return;
            }

            let csvContent = "\uFEFFژمارە,ناو,ژمارەی تەلەفۆن,کاتی تۆمارکردن\n";
            globalUsersData.forEach(u => {
                csvContent += `${u.rank},"${u.name}","${u.phone}","${u.createdAt}"\n`;
            });

            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `Traffic_List_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
